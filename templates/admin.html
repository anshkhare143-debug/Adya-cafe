<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Adya Cafe</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Adya Cafe - Admin Panel</h1>
    <a href="/" class="bg-white px-4 py-2 rounded-full shadow">← Customer Site</a>
  </div>
  
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow"><p class="text-sm text-gray-500">Total Orders</p><p id="total-orders" class="text-2xl font-bold">0</p></div>
    <div class="bg-white p-4 rounded-xl shadow"><p class="text-sm text-gray-500">Today Revenue</p><p id="revenue" class="text-2xl font-bold text-green-600">₹0</p></div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 mb-6">
    <h2 class="font-bold mb-3">Live Orders (Auto Refresh)</h2>
    <div id="orders" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
  </div>

  <div class="bg-white rounded-xl shadow p-4">
    <h2 class="font-bold mb-3">Menu Availability (On/Off)</h2>
    <div id="menu-manage" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-[400px] overflow-y-auto"></div>
  </div>
</div>
<script>
async function loadOrders(){
  const r = await fetch('/api/orders'); const orders = await r.json();
  document.getElementById('total-orders').innerText = orders.length;
  document.getElementById('revenue').innerText = '₹' + orders.reduce((s,o)=>s+o.final_total,0);
  document.getElementById('orders').innerHTML = orders.map(o=>`
    <div class="border rounded-xl p-3 bg-[#FFF8F0]">
      <div class="flex justify-between"><b>#${o.id} - ${o.name}</b><span class="text-sm">${o.time}</span></div>
      <p class="text-sm text-gray-600">${o.phone} • ${o.status}</p>
      <p class="text-sm mt-1">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</p>
      <div class="flex justify-between mt-2 font-bold"><span>${o.coupon? 'Coupon: '+o.coupon : ''}</span><span>₹${o.final_total} ${o.discount? '( -₹'+o.discount+')':''}</span></div>
    </div>
  `).join('') || '<p class="text-gray-400 text-center">No orders yet</p>';
}
async function loadMenuManage(){
  const r = await fetch('/api/menu'); const menu = await r.json();
  document.getElementById('menu-manage').innerHTML = menu.map(m=>`
    <div class="flex justify-between items-center border p-2 rounded-lg">
      <span class="text-sm">${m.img} ${m.name} - ₹${m.price} <span class="${m.available?'text-green-600':'text-red-600'}">${m.available?'ON':'OFF'}</span></span>
      <button onclick="toggleItem(${m.id})" class="px-3 py-1 rounded-full text-xs ${m.available?'bg-red-100 text-red-600':'bg-green-100 text-green-600'}">${m.available?'Turn OFF':'Turn ON'}</button>
    </div>
  `).join('');
}
async function toggleItem(id){
  await fetch('/api/toggle/'+id,{method:'POST'});
  loadMenuManage();
}
loadOrders(); loadMenuManage();
setInterval(loadOrders, 5000);
</script>
</body>
</html>
