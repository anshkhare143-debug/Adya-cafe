<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adya Cafe - Lucknow</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#FFF8F0] min-h-screen">
<!-- Header -->
<div class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-[#FF6B35]">Adya Cafe ☕</h1>
      <p class="text-xs text-gray-500">Lucknow • Pure Veg • Fast Delivery</p>
    </div>
    <button onclick="toggleCart()" class="bg-[#FF6B35] text-white px-4 py-2 rounded-full font-semibold relative">
      🛒 Cart <span id="cart-count" class="bg-white text-[#FF6B35] text-xs px-2 py-0.5 rounded-full ml-1">0</span>
      <span id="cart-total-mini" class="text-xs ml-1">₹0</span>
    </button>
  </div>
</div>

<!-- Banner -->
<div class="max-w-6xl mx-auto px-4 mt-4">
  <div class="bg-gradient-to-r from-[#FF6B35] to-[#FF8C42] rounded-2xl p-4 text-white flex justify-between items-center">
    <div>
      <p class="font-bold text-lg">Sunday Special 🎉</p>
      <p class="text-sm opacity-90">Coupon: ADYASUNDAY - Flat 20% OFF</p>
      <p class="text-xs opacity-80">Valid only on Sunday</p>
    </div>
    <div class="text-4xl">🍕</div>
  </div>
</div>

<!-- Search & Categories -->
<div class="max-w-6xl mx-auto px-4 mt-4">
  <input id="search" oninput="renderMenu()" placeholder="Search pizza, burger, maggi..." class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#FF6B35]">
  <div id="categories" class="flex gap-2 overflow-x-auto mt-3 pb-2"></div>
</div>

<!-- Menu Grid -->
<div class="max-w-6xl mx-auto px-4 mt-4 pb-32">
  <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
</div>

<!-- Cart Drawer -->
<div id="cart-drawer" class="fixed inset-0 bg-black/50 hidden z-[60]">
  <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white flex flex-col">
    <div class="p-4 border-b flex justify-between items-center">
      <h2 class="font-bold text-xl">Your Order</h2>
      <button onclick="toggleCart()" class="text-2xl">×</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t bg-[#FFF8F0]">
      <div class="flex gap-2 mb-3">
        <input id="coupon" placeholder="Coupon code" class="flex-1 p-2 rounded-lg border text-sm">
        <button onclick="applyCoupon()" class="bg-black text-white px-4 rounded-lg text-sm">Apply</button>
      </div>
      <p id="coupon-msg" class="text-xs mb-2"></p>
      <div class="space-y-1 text-sm mb-3">
        <div class="flex justify-between"><span>Subtotal</span><span id="subtotal">₹0</span></div>
        <div class="flex justify-between text-green-600 hidden" id="discount-row"><span>Discount</span><span id="discount">-₹0</span></div>
        <div class="flex justify-between font-bold text-lg"><span>Total</span><span id="final-total">₹0</span></div>
      </div>
      <input id="cust-name" placeholder="Your Name" class="w-full p-3 rounded-xl border mb-2">
      <input id="cust-phone" placeholder="Phone / Table No." class="w-full p-3 rounded-xl border mb-3">
      <button onclick="placeOrder()" class="w-full bg-[#FF6B35] text-white py-3 rounded-xl font-bold text-lg">Place Order • <span id="btn-total">₹0</span></button>
      <p class="text-xs text-center text-gray-500 mt-2">Admin: <a href="/admin" class="underline">Login</a></p>
    </div>
  </div>
</div>

<script>
let MENU=[], CART={}, CATEGORY='ALL', COUPON='', DISCOUNT=0;
async function loadMenu(){
  const r = await fetch('/api/menu'); MENU = await r.json();
  buildCategories(); renderMenu();
}
function buildCategories(){
  const cats = ['ALL', ...new Set(MENU.map(m=>m.cat))];
  document.getElementById('categories').innerHTML = cats.map(c=>`<button onclick="setCat('${c}')" id="cat-${c}" class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap ${CATEGORY===c?'bg-[#FF6B35] text-white':'bg-white border'}">${c}</button>`).join('');
}
function setCat(c){ CATEGORY=c; buildCategories(); renderMenu(); }
function renderMenu(){
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = MENU.filter(m=>{
    const matchCat = CATEGORY==='ALL' || m.cat===CATEGORY;
    const matchQ = m.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  document.getElementById('menu-grid').innerHTML = filtered.map(item=>`
    <div class="bg-white rounded-2xl p-3 shadow-sm ${!item.available?'opacity-50':''}">
      <div class="text-3xl mb-1">${item.img}</div>
      <h3 class="font-semibold text-sm leading-tight">${item.name}</h3>
      <p class="text-xs text-gray-500">${item.cat}</p>
      <div class="flex justify-between items-center mt-2">
        <span class="font-bold text-[#FF6B35]">₹${item.price}</span>
        ${item.available ? `
          <div class="flex items-center gap-1">
            ${CART[item.id] ? `<button onclick="updateQty(${item.id},-1)" class="w-7 h-7 rounded-full bg-gray-100">-</button><span class="text-sm w-5 text-center">${CART[item.id]}</span>` : ''}
            <button onclick="updateQty(${item.id},1)" class="bg-[#FF6B35] text-white px-3 py-1 rounded-full text-sm font-bold">${CART[item.id]?' + ':'Add'}</button>
          </div>` : `<span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">Sold Out</span>`
        }
      </div>
    </div>`).join('');
}
function updateQty(id, delta){
  CART[id] = (CART[id]||0)+delta;
  if(CART[id]<=0) delete CART[id];
  renderMenu(); renderCart();
}
function renderCart(){
  const ids = Object.keys(CART);
  let subtotal=0, html='';
  ids.forEach(id=>{
    const item = MENU.find(m=>m.id==id);
    const qty = CART[id];
    subtotal += item.price*qty;
    html+=`<div class="flex justify-between items-center bg-white p-3 rounded-xl"><div><p class="font-semibold text-sm">${item.name}</p><p class="text-xs text-gray-500">₹${item.price} x ${qty}</p></div><div class="flex items-center gap-2"><button onclick="updateQty(${id},-1)" class="w-7 h-7 bg-gray-100 rounded-full">-</button><span class="text-sm">${qty}</span><button onclick="updateQty(${id},1)" class="w-7 h-7 bg-[#FF6B35] text-white rounded-full">+</button></div></div>`;
  });
  if(!ids.length) html='<p class="text-center text-gray-400 mt-10">Cart is empty<br>🍕 Add something tasty!</p>';
  document.getElementById('cart-items').innerHTML=html;
  const total = subtotal - DISCOUNT;
  document.getElementById('subtotal').innerText='₹'+subtotal;
  document.getElementById('final-total').innerText='₹'+total;
  document.getElementById('btn-total').innerText='₹'+total;
  document.getElementById('cart-count').innerText=ids.reduce((s,id)=>s+CART[id],0);
  document.getElementById('cart-total-mini').innerText='₹'+total;
  document.getElementById('discount').innerText='-₹'+DISCOUNT;
  document.getElementById('discount-row').classList.toggle('hidden', DISCOUNT===0);
  window._subtotal=subtotal;
}
function toggleCart(){ document.getElementById('cart-drawer').classList.toggle('hidden'); }
function applyCoupon(){
  const code = document.getElementById('coupon').value.trim().toUpperCase();
  if(code==='ADYASUNDAY'){
    const day = new Date().getDay();
    if(day!==0){ document.getElementById('coupon-msg').innerHTML='<span class="text-red-500">Sunday ko hi valid hai!</span>'; return; }
    DISCOUNT = Math.floor(window._subtotal*0.2);
    COUPON=code;
    document.getElementById('coupon-msg').innerHTML='<span class="text-green-600">Applied! 20% OFF</span>';
  } else if(code===''){ DISCOUNT=0; COUPON=''; document.getElementById('coupon-msg').innerHTML=''; }
  else { document.getElementById('coupon-msg').innerHTML='<span class="text-red-500">Invalid coupon</span>'; DISCOUNT=0; }
  renderCart();
}
async function placeOrder(){
  const name=document.getElementById('cust-name').value.trim();
  const phone=document.getElementById('cust-phone').value.trim();
  if(!Object.keys(CART).length) return alert('Cart empty hai!');
  if(!name) return alert('Name likho');
  const items = Object.keys(CART).map(id=>{ const m=MENU.find(x=>x.id==id); return {id:m.id,name:m.name,price:m.price,qty:CART[id]}; });
  const body={items,total:window._subtotal,coupon:COUPON,name,phone};
  const res = await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if(data.error){ alert(data.error); return; }
  alert('Order Placed! ID: #'+data.order_id+' Final: ₹'+data.final_total+'\nAdya Cafe will confirm soon!');
  CART={}; COUPON=''; DISCOUNT=0; document.getElementById('coupon').value=''; renderMenu(); renderCart(); toggleCart();
}
loadMenu();
</script>
</body>
  </html>
